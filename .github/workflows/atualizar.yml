# Black House Futebol · coleta e publicação.
# Roda duas vezes por hora (:20 e :50, das 6h às 23h50 de Brasília), disparado pelo relogio.yml, para pegar as linhas
# novas das casas e a escalação oficial (sai ~60 min antes do jogo). Também roda pelo botão "Run workflow" e a cada push.
# Etapas: testes → histórico (jogos encerrados) → jogos do dia, escalações, desfalques, modelo, linhas → publica o app.
name: Atualizar dados e publicar

on:
  workflow_dispatch:
    inputs:
      historico:
        description: 'Pedidos para o histórico nesta execução (preenchimento inicial: 3000)'
        default: '300'
  push:
    branches: [main]
    paths-ignore: ['data/**', 'public/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Testes (se falhar, nada é publicado)
        run: npm test
      - name: Histórico (jogos encerrados)
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          HIST_MAX_RUN: ${{ inputs.historico || vars.HIST_MAX_RUN || '300' }}
        run: node collector/history.js
      - name: Validação do modelo (uma vez por dia, de madrugada)
        continue-on-error: true
        run: |
          h=$((10#$(TZ=America/Sao_Paulo date +%H)))
          if [ "$h" -lt 7 ] || [ ! -f public/data/calib.json ]; then node collector/calibrate.js; fi
      - name: Jogos do dia, modelo e linhas
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          APIF_MAX_RUN: ${{ vars.APIF_MAX_RUN || '120' }}
          LINHAS_URL: ${{ vars.LINHAS_URL || 'https://mccxlgtiulpknubdiyrz.supabase.co/functions/v1/linhas' }}
        run: node collector/build.js
      - name: Salvar histórico e dados no repositório
        run: |
          git config user.name "blackhouse-bot"
          git config user.email "blackhouse-bot@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deploy
        uses: actions/deploy-pages@v4
